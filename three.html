<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ozoro app</title>
    <link rel="stylesheet"
        href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&f[]=switzer@400,500,600&display=swap">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="overflow-y-auto">

    <header class="w-full mx-auto rounded-b-2xl sticky top-0 z-50 bg-white h-19">
        <nav class="flex justify-between items-left p-5 md:p-3">
            <div class="px-5 sm:px-8 md:px-9">
                <img src="assets/logo.png" alt="ozoro-logo" class="w-10 lg:hidden">
                <img src="assets/large-logo.png" alt="Large-ozoro-logo" class="w-50 hidden lg:block">
            </div>
            <div class="space-x-7 lg:pt-3 font-small flex justify-center items-center hidden lg:block uppercase">
                <a href="#">Product</a>
                <a href="#">About</a>
                <a href="#">Quality</a>
                <a href="#">Certifications</a>
                <a href="#">Contact</a>
            </div>

            <input type="checkbox" id="mobile-nav-toggle" class="peer hidden" aria-label="Toggle navigation menu" />
            <label for="mobile-nav-toggle"
                class="md:hidden inline-flex items-center justify-center w-11 h-11 rounded-xl text-charcoal hover:bg-sand/70 cursor-pointer transition-colors"
                aria-hidden="true">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="7" x2="20" y2="7" />
                    <line x1="4" y1="12" x2="20" y2="12" />
                    <line x1="4" y1="17" x2="20" y2="17" />
                </svg>
            </label>

            <button
                class="uppercase bg-amber-700 text-white px-6 sm:px-2 md:px-7 letter-spaceing rounded-full mr-3 hidden lg:block">
                <a href="#">Send a query</a>
            </button>
        </nav>
    </header>


    <!-- Hero Section -->

    <main>

        <section class="text-black px-7 lg:p-10 pb-10 bg-[#FAF9F6] pt-3">
            <div class="flex justify-between items-center p-10 h-screen">
                <div class="flex">
                    <h1 class="text-7xl md:text-[100px] md:w-[200px]">
                        Modern Medicine Traditional wisdom
                    </h1>
                    <div>
                        Hero Image Section
                    </div>
                </div>
            </div>
            <div class="px-2 md:px-5 mt-0 gap-x-6">

                <p class="uppercase text-medium">ozoro zylife</p>
                <h1 class="md:text-6xl text-5xl">One trusted name.</h1>

                <div class="space-x-2 mt-5">
                    <button class="">
                        <a href="#" class="px-7 py-4 bg-green-800 text-white rounded-full">Explore Product</a>
                    </button>
                    <button class="mt-5">
                        <a href="#" class="px-7 py-4 border rounded-full">Send a Query</a>
                    </button>
                </div>
            </div>
        </section>

        <!-- Product section -->

        <section class="mt-20 w-full px-5 lg:p-10 overflow-x-auto">
            <h1 class="text-[100px] md:text-5xl mb-10 md:w-[5 00px]">Two systems of care.One standard of quality.</h1>

            <div class="grid grid-cols-1 md:grid-cols-4 lg:grid-cols-2 md:gap-6 lg:gap-3 gap-4 mx-auto">
                <img src="" alt="" class="w-[400px] h-[400px] rounded-lg border-1">
                <img src="" alt="" class="w-[400px] h-[400px] rounded-lg border-1">
            </div>
        </section>

    </main>


</body>

</html>
